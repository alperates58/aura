services:
  # 1. PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_PATH}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura_user} -d ${POSTGRES_DB:-aura}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      aura-network:
        aliases:
          - ${POSTGRES_HOST:-aura-postgres}

  # 2. Redis 7
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - type: bind
        source: ${REDIS_DATA_PATH}
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      aura-network:
        aliases:
          - ${REDIS_HOST:-aura-redis}

  # 3. MinIO S3 Depolama
  minio:
    image: quay.io/minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: ${MINIO_DATA_PATH}
        target: /data
    networks:
      aura-network:
        aliases:
          - ${MINIO_HOST:-aura-minio}
      coolify:
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLE_S3:-true}'
      - 'traefik.http.middlewares.aura-s3-strip.stripprefix.prefixes=${TRAEFIK_S3_STRIP_PREFIX:-}'
      - 'traefik.http.middlewares.aura-s3-noauth.headers.customrequestheaders.Authorization='
      - 'traefik.http.routers.aura-s3-http.rule=${TRAEFIK_S3_RULE:-Host(`s3.aura.app`)}'
      - 'traefik.http.routers.aura-s3-http.entrypoints=http'
      - 'traefik.http.routers.aura-s3-http.middlewares=aura-redirect-https,crowdsec@file'
      - 'traefik.http.routers.aura-s3.rule=${TRAEFIK_S3_RULE:-Host(`s3.aura.app`)}'
      - 'traefik.http.routers.aura-s3.entrypoints=https'
      - 'traefik.http.routers.aura-s3.tls=true'
      - 'traefik.http.routers.aura-s3.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.aura-s3.middlewares=aura-s3-noauth,${TRAEFIK_S3_MIDDLEWARES:-crowdsec@file}'
      - 'traefik.http.routers.aura-s3.priority=${TRAEFIK_S3_PRIORITY:-120}'
      - 'traefik.http.services.aura-s3.loadbalancer.server.port=9000'

  # 4. LiveKit WebRTC SFU
  livekit:
    build:
      context: livekit
      dockerfile: Dockerfile
    restart: always
    command: --config /etc/livekit.yaml --redis-host ${REDIS_ADDR:-${REDIS_HOST:-aura-redis}:6379}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_HOST: "${REDIS_ADDR:-${REDIS_HOST:-aura-redis}:6379}"
    ports:
      - "7881:7881/udp"
      - "7881:7881/tcp"
    depends_on:
      - redis
    networks:
      aura-network:
        aliases:
          - ${LIVEKIT_HOST:-aura-livekit}
      coolify:
    labels:
      - 'traefik.enable=true'
      # 1. Dedicated Subdomain Router (Eğer livekit.domain DNS kaydı varsa)
      - 'traefik.http.routers.aura-livekit-http.rule=${TRAEFIK_LIVEKIT_RULE:-Host(`livekit.aura.app`)}'
      - 'traefik.http.routers.aura-livekit-http.entrypoints=http'
      - 'traefik.http.routers.aura-livekit-http.middlewares=aura-redirect-https,crowdsec@file'
      - 'traefik.http.routers.aura-livekit.rule=${TRAEFIK_LIVEKIT_RULE:-Host(`livekit.aura.app`)}'
      - 'traefik.http.routers.aura-livekit.entrypoints=https'
      - 'traefik.http.routers.aura-livekit.tls=true'
      - 'traefik.http.routers.aura-livekit.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.aura-livekit.middlewares=crowdsec@file'
      - 'traefik.http.routers.aura-livekit.service=aura-livekit'

      # 2. Same-Domain Path Router (Tek domain kurulumları için /rtc ve /livekit WebRTC sinyalleşmesi)
      - 'traefik.http.middlewares.aura-livekit-strip.stripprefix.prefixes=/livekit'
      - 'traefik.http.routers.aura-livekit-path-http.rule=${TRAEFIK_LIVEKIT_PATH_RULE:-(Host(`${DOMAIN:-aura.app}`) && (PathPrefix(`/rtc`) || PathPrefix(`/livekit`)))}'
      - 'traefik.http.routers.aura-livekit-path-http.entrypoints=http'
      - 'traefik.http.routers.aura-livekit-path-http.middlewares=aura-redirect-https,crowdsec@file'
      - 'traefik.http.routers.aura-livekit-path.rule=${TRAEFIK_LIVEKIT_PATH_RULE:-(Host(`${DOMAIN:-aura.app}`) && (PathPrefix(`/rtc`) || PathPrefix(`/livekit`)))}'
      - 'traefik.http.routers.aura-livekit-path.entrypoints=https'
      - 'traefik.http.routers.aura-livekit-path.tls=true'
      - 'traefik.http.routers.aura-livekit-path.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.aura-livekit-path.middlewares=aura-livekit-strip,crowdsec@file'
      - 'traefik.http.routers.aura-livekit-path.priority=${TRAEFIK_LIVEKIT_PATH_PRIORITY:-150}'
      - 'traefik.http.routers.aura-livekit-path.service=aura-livekit'
      - 'traefik.http.services.aura-livekit.loadbalancer.server.port=7880'

  # 5. Go Backend Servisi
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      PORT: "${BACKEND_PORT:-8080}"
      TZ: "Europe/Istanbul"
      APP_BASE_PATH: "${APP_BASE_PATH:-}"
      COOKIE_PATH: "${COOKIE_PATH:-${APP_BASE_PATH:-/}}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${BACKEND_PORT:-8080}/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - aura-network
      - coolify
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.aura-backend-strip.stripprefix.prefixes=${TRAEFIK_BACKEND_STRIP_PREFIX:-}'
      - 'traefik.http.routers.aura-backend-http.rule=${TRAEFIK_BACKEND_RULE:-Host(`api.aura.app`)}'
      - 'traefik.http.routers.aura-backend-http.entrypoints=http'
      - 'traefik.http.routers.aura-backend-http.middlewares=aura-redirect-https,crowdsec@file'
      - 'traefik.http.routers.aura-backend.rule=${TRAEFIK_BACKEND_RULE:-Host(`api.aura.app`)}'
      - 'traefik.http.routers.aura-backend.entrypoints=https'
      - 'traefik.http.routers.aura-backend.tls=true'
      - 'traefik.http.routers.aura-backend.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.aura-backend.middlewares=${TRAEFIK_BACKEND_MIDDLEWARES:-crowdsec@file}'
      - 'traefik.http.routers.aura-backend.priority=${TRAEFIK_BACKEND_PRIORITY:-100}'
      - 'traefik.http.services.aura-backend.loadbalancer.server.port=${BACKEND_PORT:-8080}'

  # 6. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-}"
        NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL:-}"
    restart: always
    environment:
      PORT: "${FRONTEND_PORT:-3000}"
      NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-}"
      NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL:-}"
    depends_on:
      - backend
    networks:
      - aura-network
      - coolify
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.aura-redirect-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.aura-redirect-https.redirectscheme.permanent=true'
      - 'traefik.http.routers.aura-frontend-http.rule=${TRAEFIK_FRONTEND_RULE:-Host(`zodiacrf.com`) && (Path(`/b`) || PathPrefix(`/b/`))}'
      - 'traefik.http.routers.aura-frontend-http.entrypoints=http'
      - 'traefik.http.routers.aura-frontend-http.middlewares=aura-redirect-https,crowdsec@file'
      # 1. Catch-all HTTPS Router (Statik assetler, _rsc, fetch/xhr, favicon, manifest için - Basic Auth challenge üretmez)
      - 'traefik.http.routers.aura-frontend.rule=${TRAEFIK_FRONTEND_RULE:-Host(`zodiacrf.com`) && (Path(`/b`) || PathPrefix(`/b/`))}'
      - 'traefik.http.routers.aura-frontend.entrypoints=https'
      - 'traefik.http.routers.aura-frontend.tls=true'
      - 'traefik.http.routers.aura-frontend.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.aura-frontend.middlewares=${TRAEFIK_FRONTEND_MIDDLEWARES:-crowdsec@file}'
      - 'traefik.http.routers.aura-frontend.priority=${TRAEFIK_FRONTEND_PRIORITY:-50}'
      - 'traefik.http.routers.aura-frontend.service=aura-frontend'
      # 2. Document/Navigation HTTPS Router (Yalnızca gerçek HTML GET navigation istekleri için - Basic Auth + CrowdSec)
      - 'traefik.http.routers.aura-frontend-doc.rule=${TRAEFIK_FRONTEND_DOCUMENT_RULE:-(${TRAEFIK_FRONTEND_RULE:-Host(`zodiacrf.com`) && (Path(`/b`) || PathPrefix(`/b/`))}) && Method(`GET`) && HeaderRegexp(`Accept`, `text/html`)}'
      - 'traefik.http.routers.aura-frontend-doc.entrypoints=https'
      - 'traefik.http.routers.aura-frontend-doc.tls=true'
      - 'traefik.http.routers.aura-frontend-doc.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.aura-frontend-doc.middlewares=${TRAEFIK_FRONTEND_DOCUMENT_MIDDLEWARES:-${TRAEFIK_FRONTEND_MIDDLEWARES:-crowdsec@file}}'
      - 'traefik.http.routers.aura-frontend-doc.priority=${TRAEFIK_FRONTEND_DOCUMENT_PRIORITY:-60}'
      - 'traefik.http.routers.aura-frontend-doc.service=aura-frontend'
      - 'traefik.http.services.aura-frontend.loadbalancer.server.port=${FRONTEND_PORT:-3000}'

networks:
  aura-network:
    driver: bridge
  coolify:
    external: true
